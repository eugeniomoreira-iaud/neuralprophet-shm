name: neuralprophet_env

# Channel policy: conda-forge only.
#   1. The Anaconda "defaults" channel has no osx-arm64 build of jupyterlab-github,
#      so `conda env create` fails outright on Apple Silicon when defaults is used.
#   2. conda-forge provides identical coverage on win-64, osx-arm64, osx-64 and
#      linux-64, which is what makes this file genuinely cross-platform.
#   3. Using conda-forge also avoids the Anaconda Terms of Service acceptance
#      prompt that conda 25.x raises for the defaults channel.
channels:
  - conda-forge

dependencies:
  - python=3.10

  # numpy is pinned below 2.0 deliberately. neuralprophet 0.8.0 requires
  # numpy>=1.25,<2.0. Without this pin, conda installs numpy 2.x and the later
  # `pip install neuralprophet` step silently downgrades it to 1.26, while
  # scipy, xgboost, statsmodels and pandas remain compiled against the numpy 2
  # ABI. The result is import-time crashes that look unrelated to numpy.
  - numpy>=1.25,<2

  # The BLAS provider is pinned to OpenBLAS rather than left to the solver.
  # Unconstrained, the solve pairs numpy 1.26.4 with the newest MKL, and on
  # win-64 in September 2026 that is MKL 2026.1.0, whose ABI numpy 1.26.4 was
  # not built against: every call into BLAS or LAPACK, down to a two-by-two
  # `numpy.dot`, kills the interpreter with the delay-load exception
  # 0xC06D007F and no Python traceback. Pinning the variant also makes both
  # supported platforms compute through the same library, which is the
  # cross-platform reproducibility this file exists to provide, and it removes
  # the Intel OpenMP runtime that MKL would otherwise load alongside the one
  # pip's torch wheel already carries.
  - libblas=*=*openblas
  # pandas 3 is not supported by neuralprophet 0.8.0 (requires >=2.0,<3.0).
  - pandas>=2.0,<3

  # setuptools 81 and later no longer ship `pkg_resources`, which
  # pytorch-lightning 1.9.x imports at module level. Without this pin, both
  # pytorch_lightning and neuralprophet fail to import with
  # "No module named 'pkg_resources'". Verified against setuptools 84.
  - setuptools<81

  - ipykernel
  - tqdm
  - statsmodels
  - requests
  - matplotlib
  - scipy
  - seaborn
  - jinja2
  - jupyter
  - jupyterlab-github
  - jupyterlab-git
  - jupytext
  - xgboost
  - scikit-learn
  - watchdog

  - pip
  - pip:
      # torch must stay below 2.6. PyTorch 2.6 changed the default of the
      # `weights_only` argument of torch.load from False to True, and the
      # checkpoint that pytorch-lightning 1.9.x restores during NeuralProphet's
      # learning-rate finder contains neuralprophet config objects. With torch
      # 2.6 or newer, every fit aborts with
      # "UnpicklingError: Weights only load failed". neuralprophet 0.8.0 caps
      # pytorch-lightning below 2.0, so the lightning side cannot be upgraded
      # out of the problem. Verified working: torch 2.5.1.
      - torch<2.6
      # Pinned: neuralprophet drives the whole grey-box decomposition, and an
      # unpinned upgrade would change the numeric results reported in the paper.
      - neuralprophet==0.8.0
      # kaleido renders plotly figures to static images; NeuralProphet's
      # "plotly-static" plotting backend, which Study 05 uses for its native
      # diagnostic plots, needs it. Pinned to the 0.2 line: kaleido 1.x
      # requires plotly 6 and a separate Chrome installation, while the
      # plotly 5.24 in this environment pairs with kaleido 0.2.1.
      - kaleido==0.2.1
